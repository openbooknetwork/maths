title: "More than four sides"
hesap:
  scene: geo/regular-polygon
  view: { x: [-6.5, 6.5], y: [-6.5, 6.5] }
  controls:
    n:    { slider: [5, 12], start: 6, step: 1 }
    side: { slider: [1, 3], start: 2, step: 0.5 }
  annotate: [area, angles, sides]
  readout: [area, perimeter, angle, angle-sum]
