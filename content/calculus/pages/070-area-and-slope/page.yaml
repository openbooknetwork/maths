title: "Area and slope undo each other"
hesap:
  scene: graph/accumulate
  rule: line
  coefficients: { m: -1, c: 2 }
  view: { x: [-0.5, 4.5], y: [-2.5, 2.5], below: [-0.5, 2.5] }
  from: 0
  controls:
    x: { slider: [0, 4], start: 1, step: 0.1 }
  annotate: [tangent]
  readout: [height, area, slope]
