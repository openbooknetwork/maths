title: "Changing the rule"
hesap:
  scene: graph/plot
  rule: parabola
  view: { x: [-4, 4], y: [-4, 6] }
  controls:
    a: { slider: [-2, 2], start: 1, step: 0.1 }
    b: { slider: [-3, 3], start: 0, step: 0.1 }
    c: { slider: [-3, 3], start: -1, step: 0.1 }
  annotate: [start, vertex]
  readout: [vertex]
