title: "Match the wave"
hesap:
  scene: wave/general
  angle: 360
  controls:
    amplitude: { slider: [0.5, 2], start: 1, step: 0.5 }
    frequency: { slider: [0.5, 3], start: 1, step: 0.5 }
    phase: { slider: [-180, 180], start: 0, step: 15 }
  challenge:
    goal: match
    tolerance: 0.05
    targets:
      - { amplitude: 1.5, frequency: 2, phase: 0 }
      - { amplitude: 0.5, frequency: 1, phase: 90 }
      - { amplitude: 2, frequency: 1.5, phase: -45 }
      - { amplitude: 1, frequency: 3, phase: 180 }
