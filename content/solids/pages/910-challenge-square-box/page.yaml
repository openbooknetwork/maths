title: "Size a box on a square base"
hesap:
  scene: axes/cuboid
  view: { x: [-3.2, 3.2], y: [-3.2, 3.2], z: [-3.2, 3.2] }
  controls:
    a: { slider: [1, 5], start: 2, step: 0.5 }
    b: { slider: [1, 5], start: 3, step: 0.5 }
    c: { slider: [1, 5], start: 1, step: 0.5 }
  challenge:
    goal: square-box
    targets:
      - { volume: 24 }
      - { volume: 18 }
      - { volume: 50 }
      - { volume: 12 }
