# The main page: a list of the stories under content/.
title: Open Maths Book
intro: Mathematical ideas built up one step at a time, with the figure beside the text. A free educational project. Pick an idea.
languages: [en, tr]
default_language: en
# The levels a story can have, in order. The main page lists the stories under each level by title.
levels: [beginner, intermediate, advanced]

# The engine every story runs on.
engine: hesap

# Colour theme for the site: cool, mono, navy, parchment or sepia. Readers can switch.
theme: cool

# The "Generated by kitap" note stays off the main page and the stories.
credit: false

# Where the site is published: canonical links, sitemaps and llms.txt are written from it.
url: https://openmathsbook.org/

# Content repository: Contribute link on the main page, source link on every story.
repository: https://github.com/openbooknetwork/maths

# The asset store: images, read by readers and builds at url, written by kitap upload.
assets:
  url: https://assets.openmathsbook.org/
  bucket: maths-assets
  endpoint: https://929f186b3b6db84ea6cd5dcfe90dd2b3.r2.cloudflarestorage.com

# The site bucket, in the same account: kitap deploy writes dist/ there and the Worker in worker/ serves it.
pages:
  bucket: maths-site
