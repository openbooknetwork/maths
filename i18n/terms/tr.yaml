  note: >-
    Grade 1 teaches "daha çok" as a term of comparing two groups (MAT.1.1.4), with baskets of 6 and 10 apples. The
    grades 1 to 4 programme also has "daha fazla" for data, "Hangisi daha fazladır/daha azdır?", and the grades 5 to 8
    programme has it in a pupil's words, "kırmızı top daha fazla”.

