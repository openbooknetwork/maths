"true, false (number sentences)":
  word: doğru, yanlış
  forms: [doğru veya yanlış, doğruluğunu, doğru yapan]
  status: sourced
  sources:
    - { file: meb-ilkokul-1-4, quote: "Bu eşitliklerin oluşturulma sürecini ve doğruluğunu diğer gruplarla" }
    - { file: meb-ortaokul-5-8, quote: "leri -doğru veya yanlış sayı cümleleri gibi- incelemeleri istenebilir." }
    - { file: meb-ortaokul-5-8, quote: "denklemi ya da eşitsizliği doğru yapan değerler" }
  note: The grades 1 to 4 programme says it of equalities pupils write in grade 2, as their "doğruluk", and has no "yanlış" for one.

"number sentence (calculations, comparisons)":
  status: single
  cases:
    - for: a calculation, as 5 + 3 or 5 + 3 = 8 named as the work done
      word: işlem
      forms: [toplama işlemini, işleminin, işlemleri]
      status: sourced
      sources:
        - { file: meb-ilkokul-1-4, quote: "Toplama işlemini matematiksel bir ifade olarak yazdıktan sonra aynı işlemin toplamı eksilen, toplananlardan biri çıkan, diğer toplanan da fark olacak şekilde verilerek sonuca ulaşılır." }
        - { file: meb-ortaokul-5-8, quote: "işleminin aynı zamanda 18x30, 4x9x15, 4x27x5, 20x27 işlemleri ile ifade edilmesi]." }
    - for: a line with =, such as 5 + 3 = 8, that is true or false
      word: eşitlik
      forms: [eşitlikler, eşitliklerin, eşitliğin]
      status: sourced
      sources:
        - { file: meb-ilkokul-1-4, quote: "Bu eşitliklerin oluşturulma sürecini ve doğruluğunu diğer gruplarla" }
        - { file: meb-ilkokul-1-4, quote: "şımadığı, eşitliğin iki tarafındaki matematiksel ifadelerin eşitliğini gösterdiği vurgulanır." }
        - { file: meb-ortaokul-5-8, quote: "Öğrencilerin -hesaplama yapmaksızın- verilen eşitliklerin iki tarafındaki sayı cümlelerini" }
    - for: a comparison with < or >, such as 3 < 5
      word: eşitsizlik
      forms: [eşitsizliği]
      status: single
      sources:
        - { file: meb-ortaokul-5-8, quote: "Nicelikler arasındaki eşitlik ve eşitsizlik ilişkilerini belirler." }
        - { file: meb-ortaokul-5-8, quote: "denklemi ya da eşitsizliği doğru yapan değerler" }
  note: >-
    The grades 1 to 4 programme calls 5 + 3 an "işlem" and, written in signs, a "matematiksel ifade" ("toplama ve
    çıkarma işleminin matematiksel ifade olduğunu"). A line with = it calls an "eşitlik", whose two sides are
    "matematiksel ifadeler", and grade 2 pupils write "farklı eşitlikler" and check their "doğruluk". It has no noun
    for 3 < 5: pupils compare "büyüktür ve küçüktür sembollerini kullanarak". The grades 5 to 8 programme says "sayı
    cümlesi" for a line with = from grade 5 ("25+48=48+25 ve 25+48=45+28 gibi sayı cümleleri", "doğru veya yanlış sayı
    cümleleri"), says "ifade" of a calculation with no relation sign ("5+7 ifadesinin 6+6 ifadesi ile gösterimi",
    "cebirsel ifadeler"), and "eşitsizlik" of a line with < or > from grade 7, in algebra, where it is true or not
    ("eşitsizliği doğru yapan değerler"). So "ifade" in MEB's usage is an expression on one side of a relation, and
    not the relation. A person should decide the noun for 3 < 5 between "eşitsizlik" (MEB's, from grade 7), a noun
    that covers both lines such as "sayı cümlesi" (MEB's, from grade 5, said there only of lines with =), and the
    user's "ifade". "Matematik cümlesi" has no hit in either programme.

"count on, count back (numbers)":
