# The Turkish word for each term of agents/glossary.md, with the sentence it was read in.
# Two documents are read: MEB's programme for grades 1 to 4 (meb-ilkokul-1-4), which teaches these terms, and MEB's
# programme for grades 5 to 8 (meb-ortaokul-5-8). An entry is `sourced` where both have the word, and `single` where
# one has it. No schoolbook is read yet.

"pair (objects)":
  word: bire bir eşleme
  forms: [bire bir eşlemeye]
  status: single
  sources:
    - { file: meb-ilkokul-1-4, quote: "Yapılan etkinliklerden sonra bire bir eşlemeye dayalı karşılaştırma yapmaları" }
  note: >-
    The programme names the act of pairing two groups, "bire bir eşleme", and has no noun for one pair of objects.
    "Çift" stands in the programme for an even number ("Sayıları tek-çift olarak sınıflandırabilme"), and a person
    should decide whether "çift" can name a pair of objects beside it. The engine has "Çiftler".

"partner (objects)":
  status: unsourced
  note: >-
    Searched "eş", "eşi", "eşleş". The grades 1 to 4 programme has "eş" for two objects that look the same, "Eş
    nesneler birbiri ile aynıdır.", and "eşini bulma" for finding that twin. No sentence says it of the object another
    object is paired with. The engine has "Eşi olmayan" and "eşi yok".

"pair line (figure)":
  status: unsourced
  note: >-
    A part of this book's figures. Neither programme joins two objects with a line. The plain words nearby are
    "bire bir eşleme" for the pairing, see "pair (objects)".

"the same (groups)":
  status: sourced
  cases:
    - for: two groups compared, the term grade 1 teaches
      word: eşit
      status: single
      sources:
        - { file: meb-ilkokul-1-4, quote: "İki niceliğin büyüklüğünü “çok”, “daha çok”, “az”, “daha az” veya “eşit”" }
        - { file: meb-ilkokul-1-4, quote: "Eşit öğrenci sayısına sahip iki grup öğrenciden gruptaki öğrenci sayısını belirlemeleri" }
    - for: groups with as many objects each, the plain phrase
      word: aynı sayıda
      status: sourced
      sources:
        - { file: meb-ilkokul-1-4, quote: "Farklı sayıdaki iki çokluk her grupta aynı sayıda olacak şekilde" }
        - { file: meb-ortaokul-5-8, quote: "Öğrencilerin somut materyallerden yapılmış aynı sayıda birim kareler kullanarak" }
  note: >-
    MEB's term for two groups of as many objects is "eşit", the word it also uses for numbers, and the programme
    defines it so: "sayıların miktar olarak aynı olması durumuna eşitlik denildiği". The glossary's split between "the
    same" for groups and "equal" for numbers has no MEB term behind it, and "aynı sayıda" is the plain phrase for the
    groups. A person should decide.

