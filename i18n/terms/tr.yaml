      forms: [İleriye ve geriye doğru ritmik sayabilme]
      status: single
      sources:
        - { file: meb-ilkokul-1-4, quote: "İleriye ve geriye doğru ritmik sayabilme" }
    - for: count on from the first number of an addition
      word: üzerine saymak
      forms: [üzerine sayma]
      status: single
      sources:
        - { file: meb-ilkokul-1-4, quote: "üzerine sayma gerektiren örnekler veya durumlar ile toplama" }
    - for: count back in a subtraction
      word: geriye saymak
      forms: [geriye sayma]
      status: single
      sources:
        - { file: meb-ilkokul-1-4, quote: "geriye sayma ve büyük sayıdan küçük sayıyı parçalara ayırarak adım adım çıkarma" }
  note: >-
    MEB calls counting one by one, and by twos, fives and tens, "ritmik sayma": "ileriye doğru birer, beşer ve onar".
    The grades 5 to 8 programme has no sentence about counting from a number.

