"sign (comparison)":
  status: sourced
  cases:
    - for: "< and >"
      word: sembol
      forms: [sembollerini, sembollerle]
      status: sourced
      sources:
        - { file: meb-ilkokul-1-4, quote: "Ardından birim kesirleri matematik temsillerine uygun büyüktür ve küçüktür sembollerini" }
        - { file: meb-ortaokul-5-8, quote: "kesirlerin farklı gösterimlerini “<”, “>” şeklinde sembollerle ifade etmeleri sağlanır." }
    - for: "="
      word: eşit işareti
      forms: [Eşit işaretinin]
      status: sourced
      sources:
        - { file: meb-ilkokul-1-4, quote: "Eşit işaretinin anlamını toplama ve çıkarma işlemi bağlamında" }
        - { file: meb-ortaokul-5-8, quote: "Eşit işaretinin anlamına" }
  note: >-
    MEB says "sembol" of < and >, and "işaret" of =, + and −. The grade 3 programme lists < and > under "Sembol ve
    Gösterimler" and asks pupils to use "büyüktür ve küçüktür sembollerini" when ordering. One label for all three
    signs takes one of the two words, and a person should decide. The engine has "İşaret".

"is less than, is greater than, is equal to (signs)":
  status: sourced
